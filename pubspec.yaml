name: iqaa
description: تطبيق إيقاع - مخطط يومي يعتمد على الطاقة، يعمل محلياً دون اتصال.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^13.0.0
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  intl: ^0.20.3
  fl_chart: ^0.66.0
  flutter_svg: ^2.0.9
  purchases_flutter: ^6.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
